<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="轻按一下，整理一段基于真实体验的 Google Review 参考文字。">
  <title>Google Review 文案助手｜Demo Coffee House</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563EB'/%3E%3Cpath d='M18 22h25v13c0 8-6 14-14 14S18 43 18 35V22Zm25 4h3a7 7 0 0 1 0 14h-4' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="reviews.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="review-card" aria-labelledby="business-name">
      <div class="demo-label" id="demo-label">DEMO VERSION</div>

      <div class="logo-wrap" aria-hidden="true">
        <img id="business-logo" src="images/logo.svg" alt="" width="104" height="104">
        <span class="logo-fallback" id="logo-fallback">DC</span>
      </div>

      <p class="eyebrow">GOOGLE REVIEW ASSISTANT</p>
      <h1 id="business-name">Demo Coffee House</h1>
      <p class="intro" id="intro-text">感谢您的支持！轻按下面的按钮，我们会帮您整理一段评价。</p>

      <button class="primary-button" id="generate-button" type="button">
        <span id="button-label">生成评价并前往 Google</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="status" id="status" role="status" aria-live="polite" hidden></div>

      <section class="fallback-panel" id="fallback-panel" aria-labelledby="fallback-title" hidden>
        <h2 id="fallback-title">请手动复制这段评价</h2>
        <p id="fallback-instruction">您的浏览器无法自动复制，请长按下面的评价并选择复制。</p>
        <div class="review-output" id="review-output" tabindex="0"></div>
        <a class="google-link" id="google-link" href="#" rel="noopener">前往 Google Review</a>
      </section>

      <p class="policy-note" id="policy-note">系统生成的文字仅供参考，请根据您的真实体验进行修改，并自行选择适合的评分。</p>
    </section>
  </main>

  <footer>
    <a href="https://ryankey.com.my/" target="_blank" rel="noopener">Powered by RyanKey Designs</a>
  </footer>

  <noscript>
    <div class="noscript-note">此功能需要 JavaScript。请启用 JavaScript 后再试，或直接向商家索取 Google Review 链接。</div>
  </noscript>
</body>
</html>
